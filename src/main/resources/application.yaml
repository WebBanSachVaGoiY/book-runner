server:
  port: 8080

spring:
  application:
    name: book-runner

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/book_runner_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

# App-specific parameters
app:
  jwt:
    #secret: ${JWT_SECRET}
    secret: ${JWT_SECRET:DefaultDevJwtSecret2026BookRunnerAppKeyThatIsLongEnough}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  recsys:
    user-cold-start-threshold: 5
    item-cold-start-threshold: 5
    default-recommendation-limit: 10
    max-recommendation-limit: 50
    # TTL (giờ) cho cache gợi ý cá nhân hoá; các cache khác có TTL cố định trong CacheConfig
    cache-ttl-hours: 2
    # Base URL của RecSys Microservice (FastAPI) để admin trigger training
    base-url: ${RECSYS_BASE_URL:http://localhost:8000}
    training-cron: ${RECSYS_TRAINING_CRON:0 0 2 * * ?}
    auto-training-enabled: ${RECSYS_AUTO_TRAINING_ENABLED:true}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay-return}
      version: "2.1.0"
      command: "pay"
      # Chu kỳ quét đơn VNPay quá hạn để hoàn tồn kho (mili-giây)
      expiry-scan-interval-ms: 60000
